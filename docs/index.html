<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POLITDYNASTY — Minecraft-сервер о большой политике</title>
<meta name="description" content="Minecraft-сервер о большой политике: города, выборы, династии и войны. Лаунчер сам всё установит.">
<meta property="og:image" content="assets/earth.png">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Cormorant:wght@600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0f14;
  --panel: rgba(23, 27, 35, 0.6);
  --border: rgba(86, 120, 154, 0.16);
  --border2: rgba(86, 120, 154, 0.32);
  --text: #e8ebf0;
  --dim: #9aa4b2;
  --faint: #6b7686;
  --gold: #c9a45c;
  --gold2: #e0c084;
  --steel: #6ea8dc;
  --serif: "Cormorant", Georgia, serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: "Segoe UI", system-ui, sans-serif;
  line-height: 1.6;
  min-height: 100vh;
  overflow-x: hidden;
}
::selection { background: rgba(201, 164, 92, 0.35); }

/* фон */
#starfield { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
.nebula {
  position: fixed; z-index: 0; pointer-events: none;
  width: 820px; height: 820px; border-radius: 50%;
  filter: blur(90px); opacity: 0.5;
}
.nebula-a {
  top: -280px; left: -180px;
  background: radial-gradient(circle, rgba(110, 168, 220, 0.13), transparent 65%);
  animation: drift-a 46s ease-in-out infinite alternate;
}
.nebula-b {
  bottom: -320px; right: -220px; width: 700px; height: 700px;
  background: radial-gradient(circle, rgba(201, 164, 92, 0.09), transparent 65%);
  animation: drift-b 58s ease-in-out infinite alternate;
}
@keyframes drift-a { to { transform: translate(110px, 55px); } }
@keyframes drift-b { to { transform: translate(-95px, -65px); } }
header, main, footer { position: relative; z-index: 1; }

/* шапка */
header {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; gap: 14px;
  padding: 13px 28px;
  background: rgba(13, 15, 20, 0.8);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}
header img { width: 30px; height: 30px; }
.brand { font-family: "Russo One", sans-serif; font-size: 13.5px; letter-spacing: 2.5px; }
.brand em { font-style: normal; color: var(--gold2); }
header nav { margin-left: auto; display: flex; gap: 26px; }
header nav a {
  color: var(--dim); text-decoration: none; font-size: 13px;
  transition: color 0.2s;
}
header nav a:hover { color: var(--gold2); }

/* hero */
.hero {
  min-height: calc(100vh - 58px);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center; padding: 40px 24px 60px;
  position: relative;
}
.earth-wrap { position: relative; width: min(40vh, 300px); }
.earth-halo {
  position: absolute; inset: -18%;
  background: radial-gradient(circle, rgba(110, 168, 220, 0.2) 0%, transparent 62%);
  animation: halo 6s ease-in-out infinite;
}
@keyframes halo { 50% { transform: scale(1.08); } }
.earth-orbit {
  position: absolute; inset: -13%;
  border-radius: 50%;
  border: 1px dashed rgba(110, 168, 220, 0.28);
  animation: orbit 36s linear infinite;
}
.earth-orbit::before {
  content: ""; position: absolute; top: -5px; left: 50%;
  width: 9px; height: 9px; margin-left: -4.5px;
  border-radius: 50%; background: var(--gold);
  box-shadow: 0 0 10px rgba(201, 164, 92, 0.9);
}
.earth-orbit::after {
  content: ""; position: absolute; bottom: -3px; left: 50%;
  width: 6px; height: 6px; margin-left: -3px;
  border-radius: 50%; background: var(--steel);
  box-shadow: 0 0 8px rgba(110, 168, 220, 0.9);
}
@keyframes orbit { to { transform: rotate(360deg); } }
.earth-float { animation: float 7s ease-in-out infinite; }
@keyframes float { 50% { transform: translateY(-13px); } }
.earth-wrap img {
  width: 100%; height: auto; display: block;
  filter: drop-shadow(0 0 42px rgba(110, 168, 220, 0.32));
}
.hero h1 {
  margin-top: 28px;
  font-family: "Russo One", sans-serif;
  font-size: clamp(32px, 6.4vw, 56px);
  letter-spacing: 9px; font-weight: 400;
  color: var(--gold2);
  text-shadow: 0 2px 26px rgba(0, 0, 0, 0.7);
}
.hero .motto {
  margin-top: 8px;
  font-family: var(--serif); font-weight: 600;
  font-size: clamp(18px, 2.6vw, 24px);
}
.hero .motto em { font-style: normal; color: var(--gold2); }
.hero .chip {
  margin-top: 18px;
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 12px;
  color: var(--steel); border: 1px solid rgba(110, 168, 220, 0.3);
  padding: 6px 14px; border-radius: 999px;
  background: rgba(110, 168, 220, 0.05);
}
.chip .dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--steel);
  box-shadow: 0 0 8px rgba(110, 168, 220, 0.8);
  animation: pulse 2.4s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 5px rgba(110, 168, 220, 0.5); }
  50% { box-shadow: 0 0 11px rgba(110, 168, 220, 0.9); }
}
.hero .cta { margin-top: 28px; }
.btn {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 14px 32px; border-radius: 12px;
  font-size: 15px; font-weight: 600; text-decoration: none;
  cursor: pointer; position: relative; overflow: hidden;
  transition: transform 0.18s ease, box-shadow 0.18s ease;
}
.btn svg { width: 17px; height: 17px; }
.btn-dl {
  background: linear-gradient(180deg, #265c8e, #1d4a74);
  color: #fff; border: 1px solid rgba(110, 168, 220, 0.4);
  box-shadow: 0 6px 24px rgba(29, 74, 116, 0.45);
}
.btn-dl::before {
  content: ""; position: absolute; top: 0; left: -80%; width: 50%; height: 100%;
  background: linear-gradient(105deg, transparent, rgba(255, 255, 255, 0.16), transparent);
  animation: sheen 4.2s ease-in-out infinite;
}
@keyframes sheen { 0%, 55% { left: -80%; } 100% { left: 130%; } }
.btn-dl:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(41, 96, 145, 0.55); }

/* низ */
footer {
  border-top: 1px solid var(--border);
  padding: 26px 24px 34px;
  text-align: center; color: var(--faint); font-size: 12px;
}
footer .credits { font-family: "Russo One", sans-serif; font-size: 12.5px; color: var(--dim); letter-spacing: 2px; }
footer .credits em { font-style: normal; color: var(--gold2); }
footer .fine { margin-top: 8px; max-width: 640px; margin-left: auto; margin-right: auto; font-size: 11.5px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition-duration: 0.01ms !important; }
  html { scroll-behavior: auto; }
  .reveal { opacity: 1; transform: none; }
}
</style>
</head>
<body>

<canvas id="starfield"></canvas>
<div class="nebula nebula-a"></div>
<div class="nebula nebula-b"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-download" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 19h16"/></g></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></g></symbol>
  </defs>
</svg>

<header>
  <img src="assets/favicon.png" alt="PD">
  <div class="brand">POLIT<em>DYNASTY</em></div>
</header>

<main>

<div class="hero">
  <div class="earth-wrap">
    <div class="earth-halo"></div>
    <div class="earth-orbit"></div>
    <img class="earth-float" src="assets/earth.png" alt="Планета POLITDYNASTY">
  </div>
  <h1>POLITDYNASTY</h1>
  <div class="motto">Власть не дают. <em>Её берут.</em></div>
  <div class="chip" id="ver-chip"><span class="dot"></span>Сезон I · лаунчер 2.1.0</div>
  <div class="cta">
    <a class="btn btn-dl" id="dl-btn"
       href="https://politdynasty.pages.dev/cdn/releases/download/v2.1.0/POLITDYNASTY-Setup-2.1.0.exe"
       download rel="noopener">
      <svg><use href="#i-download"/></svg>Скачать лаунчер
    </a>
  </div>
</div>

</main>

<footer>
  <div class="credits">gredixjar <em>·</em> kukuku</div>
  <div class="fine">© 2026 POLITDYNASTY. Не аффилировано с Mojang и Microsoft.</div>
</footer>

<script>
/* звёздное поле */
(function () {
  const cv = document.getElementById("starfield");
  const ctx = cv.getContext("2d");
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let stars = [], W = 0, H = 0;

  function resize() {
    W = cv.width = window.innerWidth;
    H = cv.height = window.innerHeight;
    const count = Math.min(120, Math.floor(W * H / 14000));
    stars = [];
    for (let i = 0; i < count; i++) {
      stars.push({
        x: Math.random() * W, y: Math.random() * H,
        r: Math.random() * 1.3 + 0.3,
        a: Math.random() * 0.5 + 0.12,
        tw: Math.random() * 0.02 + 0.006,
        p: Math.random() * Math.PI * 2,
        vy: Math.random() * 0.08 + 0.02,
        gold: Math.random() < 0.16
      });
    }
  }

  let t = 0;
  function frame() {
    t++;
    ctx.clearRect(0, 0, W, H);
    for (const s of stars) {
      s.y += s.vy;
      if (s.y > H + 2) { s.y = -2; s.x = Math.random() * W; }
      const alpha = s.a * (0.55 + 0.45 * Math.sin(t * s.tw * 60 + s.p));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = s.gold ? "rgba(201,164,92," + alpha + ")" : "rgba(150,185,220," + alpha + ")";
      ctx.fill();
    }
    requestAnimationFrame(frame);
  }

  resize();
  window.addEventListener("resize", resize);
  if (reduced) {
    ctx.clearRect(0, 0, W, H);
    for (const s of stars) {
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = s.gold ? "rgba(201,164,92," + s.a + ")" : "rgba(150,185,220," + s.a + ")";
      ctx.fill();
    }
  } else {
    frame();
  }
})();

/* манифест: версия и ссылка */
(function () {
  const MANIFEST = "https://politdynasty.pages.dev/cdn/manifest.json";

  fetch(MANIFEST)
    .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(m => {
      if (m.launcher && m.launcher.version) {
        const chip = document.getElementById("ver-chip");
        chip.lastChild.textContent = "Сезон I · лаунчер " + m.launcher.version;
        if (m.launcher.url) document.getElementById("dl-btn").href = m.launcher.url;
      }
    })
    .catch(() => { /* остаётся дефолтная версия и ссылка */ });
})();
</script>

</body>
</html>
